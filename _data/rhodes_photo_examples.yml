- id: cropped-sign
  group: improve
  image: ""
  capture_file: "cropped-sign.jpg"
  image_alt: "Rhodes clue photo that is almost strong but crops part of the sign."
  title: "Almost there, but the sign is cropped"
  summary: "This may look good at first because a sign appears in the frame, but only part of it is useful."
  why: "A partial sign can hide the shape, wording, colour, or mounting details that would make it recognizable."
  fix: "Step back or turn slightly so the complete sign is inside the frame while keeping the road and door visible."
  source_url: "https://maps.app.goo.gl/1CMuUXssUnCxcpVLA"
  checks:
