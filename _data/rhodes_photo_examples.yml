  image: "/assets/examples/rhodes/zoom-hides-missing-sign.webp"
  capture_file: "zoom-hides-missing-sign.webp"
  image_alt: "Zoomed view of a crowded stone street and arched doorway in Rhodes with no clear sign visible."
  title: "Zoom makes this look stronger than it is"
  summary: "The scene may still be useful, but the zoomed framing changes the hider's natural point of view and requires a retake."
  why: "Sharpness is not the same as full-point evidence. Zoom can make one detail look impressive while hiding the wider context seekers need."
  fix: "Retake the photo without zoom. Include a clear sign with the door and road if aiming for full points."
