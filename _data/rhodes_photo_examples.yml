- id: zoom-hides-missing-sign
  group: fail
  image: ""
  capture_file: "zoom-hides-missing-sign.jpg"
  image_alt: "Zoomed clue photo showing a door and road but no clear sign."
  title: "Zoom makes this look stronger than it is"
  summary: "The door and road are visible, but the tight framing removes the sign and changes the hider's natural point of view."
  why: "Sharpness is not the same as clue quality. Zoom can make one detail look impressive while hiding the wider context seekers need."
  fix: "Retake the photo without zoom and include a clear sign along with the door and road."
  source_url: "https://github.com/user-attachments/assets/84f4cb33-dfb4-4024-a125-d50cb09d53b7"
  checks:
    - label: "Door visible"
      state: pass
    - label: "Road visible"
      state: pass
    - label: "Sign missing"
      state: fail
    - label: "Zoomed"
      state: fail

- id: unclear-sign
  group: fail
  image: ""
  capture_file: "unclear-sign.jpg"
  image_alt: "Rhodes clue photo with a door and road but a sign that is too unclear to recognize."
  title: "A sign being present is not enough"
  summary: "There is a sign somewhere in the scene, but it is not clearly visible enough to use as a clue."
  why: "Players judge what the submitted photo proves. A tiny, blocked, blurred, or indistinct sign does not provide reliable information."
  fix: "Reframe from the natural point of view so the sign is unobstructed and recognizable without zoom."
  source_url: "https://maps.app.goo.gl/rkh1LCdoxfKuEZj48"
  checks:
    - label: "Door visible"
      state: pass
    - label: "Road visible"
      state: pass
    - label: "Sign unclear"
      state: fail
    - label: "No zoom"
      state: pass

- id: road-out-of-frame-one
  group: fail
  image: ""
  capture_file: "road-out-of-frame-one.jpg"
  image_alt: "Rhodes square where nearby roads are not clearly visible in the clue photo."
  title: "A nearby road does not count if it is out of frame"
  summary: "The location is a square with roads around it, but the submitted view does not actually show a clear road."
  why: "Knowledge about the surrounding map cannot replace visible evidence in the photo. Seekers should not have to infer that a road exists nearby."
  fix: "Turn or reposition the camera so a recognizable stretch of road is clearly inside the frame."
  source_url: "https://maps.app.goo.gl/Vg89YvqMhTAoztnBA"
  checks:
    - label: "Road not shown"
      state: fail
    - label: "Context implied"
      state: warn

- id: road-out-of-frame-two
  group: fail
  image: ""
  capture_file: "road-out-of-frame-two.jpg"
  image_alt: "Second Rhodes square example where the photo implies roads nearby but does not clearly show one."
  title: "The setting suggests a road, but the frame does not prove it"
  summary: "Open space or paving can resemble a street, yet the road itself remains ambiguous."
  why: "A clue has to be clear on its own. If reasonable players could disagree about whether they are seeing a road, the photo is too weak."
  fix: "Include an unmistakable road edge, direction of travel, or connected street in the unzoomed frame."
  source_url: "https://maps.app.goo.gl/TbHmC5wUcNk6S24SA"
  checks:
    - label: "Road unclear"
      state: fail
    - label: "Context ambiguous"
      state: warn
